---
name: ci
on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs, but let main/tag runs finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        # Pin a commit from the action's master branch (commits of the
        # toolchain branches are garbage-collected upstream) and select the
        # toolchain via the input instead of the ref.
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master
        with:
          # Keep in sync with rust-toolchain.toml.
          toolchain: "1.97.0"
          components: rustfmt, clippy
      - name: Cache cargo
        # Tag runs re-verify a release: keep them off restored build state;
        # PR/main runs keep the cache.
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3  # v2
        with:
          workspaces: . -> target
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (gen tool)
        # --all-targets skips bins whose required-features are off, so the
        # asset generator needs its own leg to stay warning-free.
        run: cargo clippy -p bugwarden --features gen --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets --locked

  rust-macos:
    # Portability check on macOS (Apple Silicon, aarch64-apple-darwin): build
    # and test the workspace so the platform stays viable for release
    # binaries. Kept lean (no fmt — formatting is platform-independent and
    # covered by the ubuntu `rust` job).
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master
        with:
          # Keep in sync with rust-toolchain.toml.
          toolchain: "1.97.0"
          components: clippy
      - name: Cache cargo
        # Tag runs re-verify a release: keep them off restored build state;
        # PR/main runs keep the cache.
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3  # v2
        with:
          workspaces: . -> target
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets --locked

  rust-beta:
    # Early warning on the upcoming compiler: never blocks, but surfaces
    # new-lint and regression noise before beta becomes stable. No fmt leg
    # (beta rustfmt formatting may legitimately drift).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain (beta)
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master
        with:
          toolchain: beta
          components: clippy
      - name: Cache cargo
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3  # v2
        with:
          workspaces: . -> target
      - name: Clippy (beta)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test (beta)
        run: cargo test --workspace --all-targets --locked

  rust-deny:
    # Dependency policy for the Rust workspace. Config: deny.toml
    # next to the workspace manifest (auto-discovered by cargo-deny).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25  # v2
        with:
          manifest-path: Cargo.toml
          command: check
          # Empty arguments: do not force --all-features.
          arguments: ""

  rust-msrv:
    # Build with the minimum supported Rust version (rust-version in
    # Cargo.toml) so MSRV cannot silently drift.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain (MSRV)
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master
        with:
          # Keep in sync with rust-version in Cargo.toml.
          toolchain: "1.88"
      - name: Cache cargo
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3  # v2
        with:
          workspaces: . -> target
      - name: Build (MSRV)
        run: cargo build --workspace --locked

  rust-assets-drift:
    # Regenerate the committed man page + shell completions from the clap CLI
    # and fail if they drift.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master
        with:
          # Keep in sync with rust-toolchain.toml.
          toolchain: "1.97.0"
      - name: Cache cargo
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3  # v2
        with:
          workspaces: . -> target
      - name: Regenerate man page + completions
        # Start from empty directories so an asset the generator no longer
        # emits surfaces as a deletion in the drift diff instead of shipping
        # stale forever.
        run: |
          rm -rf crates/bugwarden/man crates/bugwarden/completions
          cargo run --locked -p bugwarden --features gen --bin bugwarden-gen
      - name: Check for drift
        # Fail on modified tracked assets AND on untracked leftovers (e.g. a
        # renamed page that regeneration no longer produces/overwrites).
        run: |
          git diff --exit-code -- crates/bugwarden/man crates/bugwarden/completions
          untracked="$(git status --porcelain -- crates/bugwarden/man crates/bugwarden/completions)"
          if [ -n "$untracked" ]; then
            echo "::error::untracked generated assets:"
            echo "$untracked"
            exit 1
          fi

  changes:
    # Gate for the docker job: a full image build on every PR would be the
    # slowest leg in CI for changes that cannot affect it.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # This job's checkout is shallow, so paths-filter compares against the
      # PR base through the API rather than with git.
      pull-requests: read
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: filter
        with:
          filters: |
            docker:
              - 'Dockerfile'
              - '.dockerignore'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/**'
              # The workflows themselves: without ci.yml a change to the
              # docker job below cannot retrigger it.
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'

  docker:
    # Build-only proof that the image still builds; release.yml owns the
    # push. amd64 only — the arm64 leg needs a native runner and exists
    # there.
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: false
