---
name: ci
on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs, but let main/tag runs finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        # Pin a commit from the action's master branch (commits of the
        # toolchain branches are garbage-collected upstream) and select the
        # toolchain via the input instead of the ref.
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master
        with:
          # Keep in sync with rust-toolchain.toml.
          toolchain: "1.98.0"
          components: rustfmt, clippy
      - name: Cache cargo
        # Tag runs re-verify a release: keep them off restored build state.
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          workspaces: . -> target
          # A PR-written cache is invisible to main and evicts main's own by
          # LRU once the repo is over quota; PRs restore main's entry either
          # way, since nothing ref-specific enters the key. So: main writes,
          # PRs only read.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (gen tool)
        # --all-targets skips bins whose required-features are off, so the
        # asset generator needs its own leg to stay warning-free.
        run: cargo clippy -p bugwarden --features gen --all-targets -- -D warnings
      - name: Doc
        # rustdoc warnings are not errors, so a broken link exits 0 without
        # this. Escalated here, not in [workspace.lints], matching the clippy
        # split; private items because most of this repo's prose is on them.
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --document-private-items --locked
      - name: Doc (gen tool)
        # Same required-features gap as the clippy leg above. Neither leg
        # reaches main.rs: default target selection skips the `bugwarden`
        # bin because it shares the lib's name, and --bins would collide on
        # the lib's doc output path. main.rs stays human-reviewed.
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p bugwarden --features gen --no-deps --document-private-items --locked
      - name: Test
        run: cargo test --workspace --all-targets --locked
      - name: Doctest
        # --all-targets never runs doctests, and zero exist today (the one
        # fence is toml), so this gates the first future Rust example. Keeps
        # RUSTDOCFLAGS per-step: job-level would leak into this collection.
        run: cargo test --workspace --doc --locked

  rust-macos:
    # Portability check on macOS (Apple Silicon, aarch64-apple-darwin): build
    # and test the workspace so the platform stays viable for release
    # binaries. Kept lean (no fmt — formatting is platform-independent and
    # covered by the ubuntu `rust` job).
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master
        with:
          # Keep in sync with rust-toolchain.toml.
          toolchain: "1.98.0"
          components: clippy
      - name: Cache cargo
        # Tag runs re-verify a release: keep them off restored build state.
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          workspaces: . -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets --locked

  rust-beta:
    # Early warning on the upcoming compiler: never blocks, but surfaces
    # new-lint and regression noise before beta becomes stable. No fmt leg
    # (beta rustfmt formatting may legitimately drift).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    env:
      # The action only sets the rustup default, which rust-toolchain.toml
      # outranks; an ambient RUSTUP_TOOLCHAIN outranks the toml in turn.
      RUSTUP_TOOLCHAIN: beta
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain (beta)
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master
        with:
          toolchain: beta
          components: clippy
      - name: Cache cargo
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          workspaces: . -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # This leg is expected to fail sometimes (that is what it is for),
          # and the save otherwise needs a green one. With main the only
          # writer, a beta break would freeze this cache — right when a
          # toolchain bump has invalidated the key and PRs need it rebuilt.
          cache-on-failure: true
      - name: Assert the toolchain is a beta build
        # Guards the export above. Beta has no fixed version string, so key
        # off the channel suffix; every stable pin lacks it.
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
          actual="$(rustc --version | cut -d' ' -f2)"
          case "$actual" in
            *-beta | *-beta.*) ;;
            *)
              echo "::error::beta job is on rustc $actual, expected a beta build"
              exit 1
              ;;
          esac
      - name: Clippy (beta)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Doc (beta)
        # The rustdoc gate is -D warnings so it picks up future
        # warn-by-default rustdoc lints by itself; without a leg here the
        # first one to land fires in the required `rust` job instead.
        # Per-step env, like that job: job-level would leak into a doctest
        # collection.
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --document-private-items --locked
      - name: Doc (beta, gen tool)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p bugwarden --features gen --no-deps --document-private-items --locked
      - name: Test (beta)
        run: cargo test --workspace --all-targets --locked

  rust-deny:
    # Dependency policy for the Rust workspace. Config: deny.toml
    # next to the workspace manifest (auto-discovered by cargo-deny).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25  # v2
        with:
          manifest-path: Cargo.toml
          command: check
          # Empty arguments: the action defaults to --all-features;
          # deny.toml's [graph] owns feature selection instead.
          arguments: ""

  rust-msrv:
    # Compile with the minimum supported Rust version (rust-version in
    # Cargo.toml) so MSRV cannot silently drift.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Read the MSRV from Cargo.toml
        id: msrv
        shell: bash
        run: |
          set -euo pipefail
          msrv="$(sed -n 's/^rust-version = "\([^"]*\)".*/\1/p' Cargo.toml)"
          if [ -z "$msrv" ]; then
            echo "::error::cannot read rust-version from Cargo.toml"
            exit 1
          fi
          echo "msrv=$msrv" >> "$GITHUB_OUTPUT"
          # The action only sets the rustup default, which rust-toolchain.toml
          # outranks; an ambient RUSTUP_TOOLCHAIN outranks the toml in turn.
          echo "RUSTUP_TOOLCHAIN=$msrv" >> "$GITHUB_ENV"
      - name: Install Rust toolchain (MSRV)
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master
        with:
          toolchain: ${{ steps.msrv.outputs.msrv }}
      - name: Cache cargo
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          workspaces: . -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Assert the toolchain is the MSRV
        # If the export above ever stops working, fail here instead of
        # silently re-testing the pinned channel.
        shell: bash
        env:
          MSRV: ${{ steps.msrv.outputs.msrv }}
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
          actual="$(rustc --version | cut -d' ' -f2)"
          case "$actual" in
            "$MSRV" | "$MSRV".*) ;;
            *)
              echo "::error::MSRV job is on rustc $actual, expected $MSRV"
              exit 1
              ;;
          esac
      - name: Check (MSRV)
        # --all-targets, not a build: an MSRV break in test code or a
        # dev-dependency otherwise passes here and only bites a contributor
        # on the MSRV when they run AGENTS.md's verification block.
        run: cargo check --workspace --all-targets --locked
      - name: Check (MSRV, gen tool)
        # --all-targets skips bins whose required-features are off, and that
        # block compiles the generator too; same split as the rust job's
        # clippy/doc legs.
        run: cargo check -p bugwarden --features gen --all-targets --locked

  rust-assets-drift:
    # Regenerate the committed man page + shell completions from the clap CLI
    # and fail if they drift.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master
        with:
          # Keep in sync with rust-toolchain.toml.
          toolchain: "1.98.0"
      - name: Cache cargo
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          workspaces: . -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Regenerate man page + completions
        # Start from empty directories so an asset the generator no longer
        # emits surfaces as a deletion in the drift diff instead of shipping
        # stale forever.
        run: |
          rm -rf crates/bugwarden/man crates/bugwarden/completions
          cargo run --locked -p bugwarden --features gen --bin bugwarden-gen
      - name: Check for drift
        # Fail on modified tracked assets AND on untracked leftovers (e.g. a
        # renamed page that regeneration no longer produces/overwrites).
        run: |
          git diff --exit-code -- crates/bugwarden/man crates/bugwarden/completions
          untracked="$(git status --porcelain -- crates/bugwarden/man crates/bugwarden/completions)"
          if [ -n "$untracked" ]; then
            echo "::error::untracked generated assets:"
            echo "$untracked"
            exit 1
          fi

  toolchain-drift:
    # The image build stage never COPYs rust-toolchain.toml, so a base-image
    # bump can move the container's rustc off the pinned channel with nothing
    # failing. Deliberately not behind the `changes` paths filter: the check
    # is two sed calls, and paths-filter would skip it on a tag push.
    # release.yml carries its own copy gating the image push; this one is the
    # required context that blocks the merge, so a bump is caught on the PR.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Compare Dockerfile rust tags with rust-toolchain.toml channel
        shell: bash
        run: |
          set -euo pipefail
          # Any rust stage a per-line pattern can catch: indented, lowercase,
          # --flag=value, registry-qualified, any tag, a bare digest, or none
          # (`T` drops non-matches; an untagged stage is the rust:latest it
          # really is). ARG indirection and continuations stay out of reach.
          tags="$(sed -nE 's/^[[:space:]]*FROM[[:space:]]+(--[^[:space:]]+[[:space:]]+)*([^[:space:]]*\/)?rust([:@]([^[:space:]]+))?([[:space:]].*)?$/\4/I; T; s/^$/latest/; p' Dockerfile)"
          channel="$(sed -n 's/^channel = "\([^"]*\)".*/\1/p' rust-toolchain.toml)"
          if [ -z "$tags" ] || [ -z "$channel" ]; then
            echo "::error::cannot read the Rust version: Dockerfile FROM tags '$tags', rust-toolchain.toml channel '$channel'"
            exit 1
          fi
          # Check every stage found above, so a second one cannot drift past.
          while IFS= read -r tag; do
            tag="${tag%%@*}"  # the digest pins the image, not the toolchain
            if [ "${tag%%-*}" != "$channel" ]; then
              echo "::error::toolchain drift: Dockerfile builds on rust:$tag but rust-toolchain.toml pins channel $channel -- bump both together"
              exit 1
            fi
          done <<< "$tags"
          echo "in sync: Dockerfile rust:$channel == rust-toolchain.toml channel $channel"

  design-stamp-drift:
    # docs/DESIGN.md hard-stamps the pinned rmcp version in registry-path,
    # macro-crate, git-tag and prose shapes -- including one line that names
    # the version with no `rmcp` token on it at all -- and #135 exists because
    # a bump landed and they went stale. A sibling job rather than a leg of
    # toolchain-drift: that one has a deliberate twin in release.yml gating the
    # image push, where a docs stamp has no business. Same reason it skips the
    # `changes` filter: it is four one-line extractions, and paths-filter
    # would skip it on a tag push.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Compare DESIGN.md version stamps with Cargo.lock's rmcp
        shell: bash
        run: |
          set -euo pipefail
          # In a lock entry version always follows name, so `n` fails closed if
          # that shape ever changes. Two rmcp entries would be ambiguous, so
          # anything but exactly one line is an error, not a pick.
          lock="$(sed -nE '/^name = "rmcp"$/{n;s/^version = "([^"]*)"$/\1/p;}' Cargo.lock)"
          if [ -z "$lock" ] || [ "$(printf '%s\n' "$lock" | wc -l)" -ne 1 ]; then
            echo "::error::cannot read one rmcp version from Cargo.lock (got '$lock')"
            exit 1
          fi
          # Every three-or-more-part version token in the file, not just the
          # ones on a line mentioning rmcp: one stamp says only "in 3.1.4". The
          # loopback addresses are the sole other such token today and this
          # check keeps it that way -- a new non-rmcp X.Y.Z fails here and has
          # to be decided, rather than being silently skipped by a narrower
          # pattern (#171). Comparison is textual: a prerelease pin
          # (3.1.4-rc.1) fails closed until this pattern learns the suffix.
          drift=0
          stamps="$(grep -oE '[0-9]+(\.[0-9]+){2,}' docs/DESIGN.md \
            | grep -vE '^127\.0\.0\.[0-9]+$' | sort -u)" || true
          if [ -z "$stamps" ]; then
            echo "::error::no version stamps found in docs/DESIGN.md -- the doc or this pattern changed"
            exit 1
          fi
          while IFS= read -r stamp; do
            if [ "$stamp" != "$lock" ]; then
              echo "::error::stamp drift: docs/DESIGN.md says $stamp but Cargo.lock pins rmcp $lock"
              grep -nF -- "$stamp" docs/DESIGN.md || true
              drift=1
            fi
          done <<< "$stamps"
          # The one two-part stamp is DESIGN.md quoting the manifest's own
          # requirement, so it is compared with that manifest and not with the
          # lock: a lock-only patch bump does not move the requirement, and
          # comparing it there would teach the doc to misquote Cargo.toml.
          # DESIGN.md's other two-part mentions ("rmcp 3.1 usage notes", "rmcp
          # 3.1 default") stay unchecked -- the file also names rmcp 2.2 and
          # axum 0.8 in that shape, so no line rule tells a stamp from a
          # deliberate reference. They can only go stale alongside a three-part
          # stamp, which already fails above.
          req="$(sed -nE 's/^rmcp = \{ version = "([^"]*)".*/\1/p' crates/bugwarden/Cargo.toml | sort -u)"
          quote="$(sed -nE 's/.*rmcp = \{ version = "([^"]*)".*/\1/p' docs/DESIGN.md | sort -u)"
          if [ -z "$req" ] || [ -z "$quote" ] || [ "$req" != "$quote" ]; then
            echo "::error::quote drift: docs/DESIGN.md quotes rmcp version '$quote' but crates/bugwarden/Cargo.toml requires '$req'"
            drift=1
          fi
          if [ "$drift" -ne 0 ]; then
            exit 1
          fi
          echo "in sync: docs/DESIGN.md stamps rmcp $lock, quotes requirement $quote"

  changes:
    # Gate for the docker job: a full image build on every PR would be the
    # slowest leg in CI for changes that cannot affect it.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # This job's checkout is shallow, so paths-filter compares against the
      # PR base through the API rather than with git.
      pull-requests: read
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: filter
        with:
          filters: |
            docker:
              - 'Dockerfile'
              - '.dockerignore'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/**'
              # The workflows themselves: without ci.yml a change to the
              # docker job below cannot retrigger it. Same for the smoke
              # script the job runs.
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
              - 'scripts/**'

  docker:
    # Builds the image and then RUNS it. `push: false` alone only proved the
    # image still assembles: nothing started it, so the distroless base, the
    # nonroot uid, the ENV defaults and the BUGWARDEN_POLICY refuse-to-start
    # path all shipped unverified (#202). #114 was a defect of exactly that
    # shape. release.yml owns the push, and runs the same script on both
    # architectures against the digests it pushed; amd64 here, on a locally
    # loaded image, is the rehearsal every docker-touching PR gets.
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Local-daemon tag; nothing is pushed under it.
      IMAGE: bugwarden:ci
      CTR: bugwarden-smoke
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          # What is built is unchanged; `load` only exports the result to the
          # local daemon, which `push: false` on its own does not — it leaves
          # the image in the builder's cache where nothing can run it. Safe
          # because this builds one platform: `load` refuses a multi-platform
          # result rather than silently picking a leg.
          load: true
          tags: ${{ env.IMAGE }}

      # The assertions live in scripts/container-smoke.sh so release.yml can
      # run the identical set against each architecture's pushed digest
      # (#223); actionlint's per-`run:` shellcheck stops at a workflow file, so
      # actionlint.yml shellchecks the script whole.
      - name: Serve behind the bearer gate with a mounted policy
        run: scripts/container-smoke.sh serve
      - name: Run as the nonroot uid the deployment docs pin
        run: scripts/container-smoke.sh uid
      - name: Stop gracefully on SIGTERM as PID 1
        run: scripts/container-smoke.sh sigterm
      - name: Refuse to start with no policy mounted
        run: scripts/container-smoke.sh policy
      - name: Ship no shell
        run: scripts/container-smoke.sh shell
      - name: Ship a CA bundle the binary loads
        run: scripts/container-smoke.sh ca
