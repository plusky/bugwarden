---
name: release
# yamllint disable-line rule:truthy
on:
  push:
    tags:
      # Version tags: 0.1.0, optionally with a pre-release suffix (0.1.0rc1).
      # The project tags without a "v" prefix.
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.triple }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # Build every platform even if one fails, so a single broken target
      # surfaces on its own. The release job needs all legs to succeed, so a
      # failure still blocks publishing a partial set of artifacts.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
          - os: macos-latest  # Apple Silicon
            triple: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master
        with:
          # Keep in sync with rust-toolchain.toml.
          toolchain: "1.98.0"
      # No cargo cache here: releases are built hermetically so restored
      # build state can never influence published artifacts.

      - name: Verify tag matches workspace version
        shell: bash
        run: |
          pkg="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag '$GITHUB_REF_NAME' != workspace version '$pkg'"
            exit 1
          fi

      - name: Build release binary
        run: cargo build --release --locked -p bugwarden

      - name: Package release artifact
        shell: bash
        run: |
          triple="${{ matrix.triple }}"
          dist="bugwarden-${GITHUB_REF_NAME}-${triple}"
          mkdir "$dist"
          cp target/release/bugwarden LICENSE README.md "$dist/"
          mkdir "$dist/examples"
          cp examples/policy.toml "$dist/examples/"
          # Committed generated assets, kept in sync by the rust-assets-drift
          # CI job (`cp -R` exists on both the ubuntu and macOS runners).
          cp -R crates/bugwarden/man crates/bugwarden/completions "$dist/"
          tar czf "${dist}.tar.gz" "$dist"
          # shasum -a 256 exists on both the ubuntu and macOS runners and its
          # output is compatible with `sha256sum -c`.
          shasum -a 256 "${dist}.tar.gz" >"${dist}.tar.gz.sha256"
          echo "DIST=$dist" >>"$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ matrix.triple }}
          path: |
            ${{ env.DIST }}.tar.gz
            ${{ env.DIST }}.tar.gz.sha256
          if-no-files-found: error

  package:
    # Distribution packages, x86_64 only: they mirror the one Linux triple the
    # `build` matrix ships, and the openSUSE packages come from OBS anyway
    # (devel:tools), which builds every tier-1 arch from the source tarball.
    # Sibling of `build`, not downstream of it — the two share no output, and
    # `release` waits for both.
    name: package (deb, rpm)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master
        with:
          # Keep in sync with rust-toolchain.toml.
          toolchain: "1.98.0"
      # No cargo cache, same hermetic-release rule as `build` above.

      - name: Verify tag matches workspace version
        shell: bash
        run: |
          pkg="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag '$GITHUB_REF_NAME' != workspace version '$pkg'"
            exit 1
          fi

      - name: Install packaging tools
        # Pinned exactly and --locked: the packagers' own lockfiles decide
        # their dependencies, so a release cannot change shape because an
        # unrelated crate published that morning.
        run: |
          cargo install cargo-deb --locked --version 3.7.0
          cargo install cargo-generate-rpm --locked --version 0.16.1

      - name: Build release binary
        run: cargo build --release --locked -p bugwarden

      - name: Strip the packaged binary
        # cargo-deb strips by default and cargo-generate-rpm cannot at all, so
        # strip once here and tell cargo-deb not to: both packages then ship a
        # byte-identical binary. The tarballs keep their symbols (unchanged).
        run: strip target/release/bugwarden

      - name: Build packages
        shell: bash
        run: |
          set -euo pipefail
          # Note the asymmetry: cargo-deb's -p takes a PACKAGE NAME,
          # cargo-generate-rpm's a MANIFEST DIRECTORY. Both read their
          # metadata from crates/bugwarden/Cargo.toml and write under the
          # workspace target dir.
          cargo deb -p bugwarden --no-build --no-strip
          # An RPM Version may not contain '-'. cargo-deb rewrites a semver
          # pre-release to '~' itself; cargo-generate-rpm passes it through,
          # producing an illegal Version that also sorts NEWER than the final
          # release. Convert here. No-op for a plain 0.2.0 tag.
          rpmver="$(printf '%s' "$GITHUB_REF_NAME" | tr -- - '~')"
          # --auto-req on the CLI, not in Cargo.toml: the metadata key silently
          # ignores every value but "no"/"disabled", which would leave the
          # dependency set up to whichever find-requires the runner has.
          cargo generate-rpm -p crates/bugwarden --auto-req builtin \
            -s "version = \"${rpmver}\""

      - name: Check the packages before they can be released
        shell: bash
        run: |
          set -euo pipefail
          deb="$(echo target/debian/*.deb)"
          rpm="$(echo target/generate-rpm/*.rpm)"

          # Both packagers exit 0 on an empty dependency set, and a package that
          # installs on a too-old glibc and then dies at exec is worse than one
          # that fails to build. `release` needs us, so failing here costs a tag
          # and no more.
          dpkg-deb -f "$deb" Depends | grep -q libc6 \
            || { echo "::error::deb has no libc6 dependency"; exit 1; }
          rpm -qp --requires "$rpm" | grep -q '^libc\.so' \
            || { echo "::error::rpm has no libc.so dependency"; exit 1; }

          # Every asset actually landed. The two lists differ by one entry on
          # purpose: cargo-deb gzips man pages, cargo-generate-rpm does not.
          rpmfiles="$(rpm -qpl "$rpm")"
          for want in /usr/bin/bugwarden /etc/bugwarden/policy.toml \
                      /etc/bugwarden/audit.toml /usr/share/man/man1/bugwarden.1; do
            grep -qxF "$want" <<<"$rpmfiles" \
              || { echo "::error::rpm is missing $want"; exit 1; }
          done
          debfiles="$(dpkg-deb -c "$deb" | awk '{print $NF}')"
          for want in ./usr/bin/bugwarden ./etc/bugwarden/policy.toml \
                      ./etc/bugwarden/audit.toml ./usr/share/man/man1/bugwarden.1.gz; do
            grep -qxF "$want" <<<"$debfiles" \
              || { echo "::error::deb is missing $want"; exit 1; }
          done

          # /etc/bugwarden is rpm-owned, so erasing the package does not orphan
          # it. dpkg tracks its own directories and needs no equivalent.
          rpm -qp --qf '[%{FILENAMES}|%{FILEMODES:octal}\n]' "$rpm" \
            | grep -qxF '/etc/bugwarden|40755' \
            || { echo "::error::rpm does not own /etc/bugwarden"; exit 1; }

          # I1: the shipped policy must not be loaded implicitly. A package that
          # made /etc/bugwarden/policy.toml take effect on install would hand
          # every fresh install a policy nobody chose.
          test "$(rpm -qp --qf '%{PREIN}%{POSTIN}%{PREUN}%{POSTUN}' "$rpm")" = "(none)(none)(none)(none)" \
            || { echo "::error::rpm gained a scriptlet"; exit 1; }

      - name: Collect packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          cp target/debian/*.deb target/generate-rpm/*.rpm dist/
          cd dist
          # A release asset name is rewritten by GitHub to [A-Za-z0-9._-], which
          # a pre-release deb's '~' trips. Rename first, so the .sha256 does not
          # end up naming a file that never arrives.
          for f in *.deb *.rpm; do
            safe="$(printf '%s' "$f" | tr -c 'A-Za-z0-9._-' '.')"
            [ "$safe" = "$f" ] || mv -- "$f" "$safe"
          done
          for f in *.deb *.rpm; do
            sha256sum "$f" >"${f}.sha256"
          done
          ls -l

      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: packages
          path: dist/*
          if-no-files-found: error

  release:
    # Publish only after every tarball AND both distro packages are built and
    # checked, so a release never ships a partial artifact set. That does mean a
    # packaging fault now blocks the crates.io publish and the container image.
    needs: [build, package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # required for `gh release create`
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout in this job, so tell gh which repo to act on.
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --title "$GITHUB_REF_NAME"
          --generate-notes
          dist/*

  toolchain-drift:
    # ci.yml's guard, script copied verbatim, so a tag push is prevented and
    # not merely reported. It gates `container` and through it
    # `container-manifest` alone: the image is the sole artifact the
    # Dockerfile toolchain reaches (build, package and publish compile under
    # the rust-toolchain.toml pin), a pushed manifest cannot be cleanly
    # unshipped, and a container fault must still not hold back binaries or
    # crates. Same job name deliberately -- release.yml never runs on a pull
    # request, so this check run cannot collide with the required context of
    # that name.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Compare Dockerfile rust tags with rust-toolchain.toml channel
        shell: bash
        run: |
          set -euo pipefail
          # Any rust stage a per-line pattern can catch: indented, lowercase,
          # --flag=value, registry-qualified, any tag, a bare digest, or none
          # (`T` drops non-matches; an untagged stage is the rust:latest it
          # really is). ARG indirection and continuations stay out of reach.
          tags="$(sed -nE 's/^[[:space:]]*FROM[[:space:]]+(--[^[:space:]]+[[:space:]]+)*([^[:space:]]*\/)?rust([:@]([^[:space:]]+))?([[:space:]].*)?$/\4/I; T; s/^$/latest/; p' Dockerfile)"
          channel="$(sed -n 's/^channel = "\([^"]*\)".*/\1/p' rust-toolchain.toml)"
          if [ -z "$tags" ] || [ -z "$channel" ]; then
            echo "::error::cannot read the Rust version: Dockerfile FROM tags '$tags', rust-toolchain.toml channel '$channel'"
            exit 1
          fi
          # Check every stage found above, so a second one cannot drift past.
          while IFS= read -r tag; do
            tag="${tag%%@*}"  # the digest pins the image, not the toolchain
            if [ "${tag%%-*}" != "$channel" ]; then
              echo "::error::toolchain drift: Dockerfile builds on rust:$tag but rust-toolchain.toml pins channel $channel -- bump both together"
              exit 1
            fi
          done <<< "$tags"
          echo "in sync: Dockerfile rust:$channel == rust-toolchain.toml channel $channel"

  container:
    # Native runners per architecture: an emulated aws-lc-sys compile under
    # QEMU takes tens of minutes, and ubuntu-24.04-arm makes it unnecessary.
    # Sibling of `publish`, not upstream of it: a broken image build must not
    # hold back the crates.io release of a tag whose binaries already shipped.
    needs: [release, toolchain-drift]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      # Push the per-architecture images to ghcr.io.
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare
        shell: bash
        run: |
          set -euo pipefail
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >>"$GITHUB_ENV"
          # Tags here are the bare version, no "v" prefix (see AGENTS.md), and
          # the `build` job already refused any tag that disagrees with the
          # workspace manifest.
          echo "VERSION=$GITHUB_REF_NAME" >>"$GITHUB_ENV"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: VERSION=${{ env.VERSION }}
          # No cache-from/cache-to: releases build hermetically, same rule as
          # the cargo-cache-free `build` job above.
          outputs: type=image,name=ghcr.io/plusky/bugwarden,push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  container-manifest:
    # The tags only ever appear once every architecture pushed its digest, so
    # ghcr.io never serves a half-populated multi-arch tag.
    needs: container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push the multi-arch manifest
        working-directory: /tmp/digests
        shell: bash
        run: |
          set -euo pipefail
          tags=(-t "ghcr.io/plusky/bugwarden:$GITHUB_REF_NAME")
          # The tag glob admits pre-releases (0.2.0rc1); those must not
          # become `latest`.
          if [[ "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            tags+=(-t ghcr.io/plusky/bugwarden:latest)
          fi
          # shellcheck disable=SC2046  # splitting the digest list is intended
          docker buildx imagetools create "${tags[@]}" \
            $(printf 'ghcr.io/plusky/bugwarden@sha256:%s ' *)
      - name: Inspect the published manifest
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "ghcr.io/plusky/bugwarden:$GITHUB_REF_NAME"

  publish:
    # crates.io last: a version can be yanked but never replaced, so it only
    # goes out once every platform built and the GitHub release exists.
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Trusted Publishing exchanges this OIDC token for a short-lived
      # crates.io token, so no registry credential is stored in the repo.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master
        with:
          # Keep in sync with rust-toolchain.toml.
          toolchain: "1.98.0"

      - name: Authenticate to crates.io
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18  # v1.0.5
        id: auth

      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$GITHUB_REF_NAME"
          # bugwarden-core first: the binary crate resolves its dependency
          # from the index and cannot even be packaged before core is there.
          for crate in bugwarden-core bugwarden; do
            # Re-running a release must not fail on a version already up.
            if curl -sSf -H 'User-Agent: bugwarden-release' \
                 "https://crates.io/api/v1/crates/${crate}/${version}" >/dev/null 2>&1; then
              echo "::notice::${crate} ${version} is already published, skipping"
              continue
            fi
            cargo publish --locked -p "$crate"
          done
