---
name: dependency-review
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  # Write only so the action can post its summary comment on the PR.
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    # Block PRs that add a vulnerable or copyleft dependency before merge.
    # Complements Dependabot, which only alerts once code is on main.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # This is a permissive Apache-2.0 project: reject copyleft
          # dependencies. MPL-2.0 (file-level copyleft) is intentionally NOT
          # listed — deny.toml allows it. Keep this list in sync with the
          # license policy in deny.toml.
          deny-licenses: >-
            GPL-2.0-only,
            GPL-2.0-or-later,
            GPL-3.0-only,
            GPL-3.0-or-later,
            AGPL-3.0-only,
            AGPL-3.0-or-later,
            LGPL-2.1-only,
            LGPL-2.1-or-later,
            LGPL-3.0-only,
            LGPL-3.0-or-later,
            CDDL-1.0,
            EPL-1.0,
            EPL-2.0,
            MPL-1.1,
            OSL-3.0
