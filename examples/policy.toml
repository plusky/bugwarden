# bugwarden guard policy — worked example
# =======================================
#
# The scenario this file implements:
#
#   * undisclosed (embargoed) security bugs are completely invisible, always;
#   * so is every bug that is not world-readable — see rule 1, which is
#     deliberately broader than "security" and can be narrowed;
#   * bugs in groups NAMED like security groups are invisible in their own
#     right — see "security-groups", which keeps denying them even after
#     rule 1 is narrowed or removed;
#   * bugs labelled "security" are invisible while they are fresher than
#     5 days (the window in which details are typically still unreviewed);
#   * every other bug is shown to the user in full;
#   * new bug reports are accepted into the desktop products ONLY — see the
#     "reporters" rule in section 0, whose `operations = ["create"]` scope
#     grants filing without touching what may be read — except that a title
#     carrying the embargo marker may not be filed anywhere
#     ("no-embargo-filings"). Everywhere else filing is refused: the first
#     deny rule the create gate reaches ("group-restricted") consults the
#     group list, a not-yet-created bug's groups cannot be known, and
#     unknown fails closed.
#
# The policy is read once at server startup (--policy / BUGWARDEN_POLICY) and
# is never visible to the MCP client. Parsing is strict: unknown keys anywhere
# are a startup error, so typos cannot silently disable a guard.
#
# Rule evaluation order:
#   1. global.min_bug_age_days (a too-young bug is invisible, no rule runs;
#      this gate is global — it is never operation-scoped, and it refuses
#      creation too, since a just-created bug would be immediately hidden)
#   2. [[rule]] entries top to bottom — FIRST MATCH WINS. A rule carrying
#      `operations = [...]` is consulted only for the operations it names
#      ("create" = the create gate judging a prospective bug, "access" =
#      every classification of an existing bug); the scope is checked
#      BEFORE the rule's match criteria, so a scoped rule is completely
#      invisible to the operations it does not cover.
#   3. default_action for bugs no rule matched
#
# Unreadable metadata: if a bug object does not carry a field some rule asks
# about — absent, null, wrongly typed, or a list with an unreadable element —
# that rule cannot be decided and the bug is DENIED, whatever the rule's
# action. This holds for every criterion of every rule CONSULTED for the
# operation at hand — an operation-scoped rule (section 0) is skipped before
# its criteria are read, so it can make nothing undecidable for the
# operations it does not cover — and none of the rules below repeats it.
# A field that is present but empty ("" or []) is knowledge, not ignorance,
# and matches normally.
#
# Glob syntax (products/components/groups/keywords/statuses/severities/
# priorities): case-insensitive match of the whole value; '*' matches any
# (possibly empty) substring; everything else is literal.

# What happens to bugs that no rule below matches: everything not caught by a
# rule stays fully visible.
# One of "allow" | "deny" ("restrict" is not permitted here — use a catch-all
# restrict rule as the last [[rule]] instead).
default_action = "allow"

[global]
# Blanket minimum age for EVERY bug, regardless of labels. This example does
# not use it — freshness is only restricted for security bugs, via the rules
# below — but set it to N to make all bugs younger than N days invisible.
min_bug_age_days = 0

# Master switch for private content: comments, attachment metadata, and
# attachment downloads. Even with `true`, each call must additionally pass
# include_private = true. On an attachment download a MISSING privacy flag
# counts as private. Default (and recommended): false.
allow_private_comments = false

# Strip all write capabilities from every grant and remove the write tools
# from the MCP tool listing. The --read-only CLI flag ORs into this — the CLI
# can tighten this policy but never loosen it.
read_only = false

# Tool names to remove from the MCP tool listing entirely (clients never see
# them). Works independently of read_only.
#disabled_tools = ["update_bug_dependencies", "mark_as_duplicate"]

# Largest attachment (decoded bytes) download_attachment may return; the
# content is embedded base64 in the tool result and consumes model context.
# The same ceiling caps what add_attachment may UPLOAD, also measured on the
# decoded bytes. 0 removes the cap. Default: 2 MiB.
#max_attachment_bytes = 2097152

# ---------------------------------------------------------------------------
# 0. New bug reports: accepted into the desktop products, and only there.
#
# Filing must be decided before the bug exists, so the policy judges the bug
# AS DESCRIBED by the create request. The first deny rule below
# ("group-restricted") consults the group list, the group list of a
# not-yet-created bug is unknowable (Bugzilla unions the product's mandatory
# groups into whatever the request claims), and unknown fails closed — so
# every create request that reaches it is refused, and no rule after it is
# ever consulted for creation. A rule granting "create" must therefore come
# BEFORE it.
#
# What makes that placement safe is `operations = ["create"]`: the rule is
# consulted ONLY by the create gate and is invisible to every classification
# of an EXISTING bug, including the fail-closed handling of unreadable
# metadata. Without the scoping, this rule would also be the first match for
# every existing bug in these products — and a restrict rule's
# `capabilities` list is the COMPLETE grant for all operations the rule
# covers, not an addition to what other rules or the default would allow, so
# `capabilities = ["create"]` alone would silently make those bugs
# unreadable (gone from searches, "not accessible" from bug_info). With the
# scoping, filing works and reads are untouched: existing GNOME*/KDE* bugs
# fall through to the rules below and default_action exactly as if this
# rule did not exist.
#
# Granting creation ahead of the deny rules also takes their OTHER screens
# out of the create path, so the title screen is restated create-side:
# "no-embargo-filings" refuses a filing whose title carries the embargo
# marker, which "reporters" would otherwise accept and "undisclosed-marker"
# would then instantly hide (a bug created and never readable serves
# nobody). The keyword screen ("embargo-keyword") deliberately has no
# create-side twin: a create request may omit `keywords`, an omitted field
# is unknown, and unknown fails closed — a keyword rule ahead of the grant
# would refuse every keywordless filing. Residual, accepted: a desktop
# filing that CLAIMS an embargo keyword is created and then immediately
# hidden by "embargo-keyword".
#
# NOTE: bugwarden versions without operation support REJECT a policy using
# `operations` at startup — parsing is strict, so the whole file fails
# closed instead of the rule being silently misread as unscoped.

[[rule]]
name = "no-embargo-filings"
description = "Embargo-marked titles may not be filed anywhere"
action = "deny"
operations = ["create"]
[rule.match]
# Same criterion as "undisclosed-marker" below; scoped to the create gate so
# it screens filings without duplicating that rule's job for reads.
summary_contains = ["embargo"]

[[rule]]
name = "reporters"
description = "Desktop products accept new bug reports"
action = "restrict"
capabilities = ["create"]
operations = ["create"]
[rule.match]
products = ["GNOME*", "KDE*"]

# ---------------------------------------------------------------------------
# 1. Undisclosed security bugs: fully invisible, at any age.
#
# An issue under embargo is one whose public disclosure date has not arrived
# yet, and it is normally recognisable two ways, independently: the bug is
# readable only through a Bugzilla group, and its title carries a marker the
# security team removes when the issue goes public. Either signal alone is
# enough to hide the bug here, which means a bug that loses one of them (a
# permission edited by hand, a marker typo) is still covered by the other.
#
# NOTE: criteria inside one `match` are AND-ed (a bug must satisfy all of
# them), while entries inside one list are ORed. "Restricted OR marked"
# therefore needs two consecutive deny rules, not one.
#
# NOTE: a bug's title is itself sensitive while the issue is undisclosed — it
# names the package and often the flaw. That is why these rules use `deny`
# and not `restrict` with a `summary` capability: a summary view would hand
# the client exactly the line that must not leak.
# ---------------------------------------------------------------------------

[[rule]]
name = "group-restricted"
description = "Bugs that are not world-readable are invisible"
action = "deny"
[rule.match]
# true = the bug is readable only through at least one Bugzilla group. This
# asks the question in an instance-independent way, so it needs no knowledge
# of local group names and cannot be defeated by a group being renamed.
#
# This is deliberately broad: it also hides non-security bugs that happen to
# be group-restricted (partner-confidential reports, internal-only products).
# If that is more than you want, narrow this rule (replace
# `group_restricted = true` with a `groups = [...]` glob list) or drop it —
# but FIRST check the "security-groups" rule below against the group names
# your instance actually uses. It keeps hiding security groups by name only
# where its globs match; names built from other stems ("infosec", "psirt",
# "secteam", ...) must be added to its list before this rule stops covering
# them.
group_restricted = true

[[rule]]
name = "security-groups"
description = "Bugs in security/internal-named groups are invisible"
action = "deny"
[rule.match]
# Backstop for the rule above, and redundant only as long as that rule keeps
# its full breadth: "group-restricted" already hides these bugs, but it hides
# every other restricted bug too, and the moment an operator narrows or
# deletes it (say, to let partner-confidential bugs through) the security
# groups must not slip out with them. This rule names them, so it keeps
# denying entirely on its own.
#
# Matches if ANY of the bug's groups matches ANY of these globs. The three
# stems cover the names instances commonly build their sensitive groups
# from: the security team's own groups ("security", "corp-security",
# "Security Internal"), groups named for the embargo state, and groups named
# for internality rather than security ("internal-only"). Group vocabularies
# are per-instance, though: check the names your instance actually uses and
# extend the list. Erring broad is safe here — an extra match only hides a
# bug; a missed name is what the rule above exists to catch.
groups = ["*security*", "*embargo*", "*internal*"]

[[rule]]
name = "undisclosed-marker"
description = "Bugs whose title marks them as not yet disclosed are invisible"
action = "deny"
[rule.match]
# Case-insensitive substring search in the bug's one-line summary.
summary_contains = ["embargo"]

[[rule]]
name = "embargo-keyword"
description = "Bugs flagged with an embargo keyword are invisible"
action = "deny"
[rule.match]
# Keyword vocabularies are per-instance; check yours and adjust these globs.
keywords = ["security-embargo", "embargo*"]

# ---------------------------------------------------------------------------
# 2. Fresh security bugs: invisible until they are 5 days old.
#
# Both criteria are AND-ed, so these rules hide a bug only while it is BOTH
# security-labelled AND younger than 5 days. Once a world-readable bug ages
# past the window, no rule matches it any more and default_action ("allow")
# applies — it becomes fully visible without any policy change. (A
# group-restricted bug stays hidden at any age: rule 1 catches it first.)
#
# Two rules because "security" can be expressed two ways here; drop the one
# your instance does not use. A group-based variant would be pointless: any
# bug in a security group is already denied by rule 1.
# ---------------------------------------------------------------------------

[[rule]]
name = "fresh-security-keyword"
description = "Security-keyworded bugs are hidden for their first 5 days"
action = "deny"
[rule.match]
keywords = ["security*"]
younger_than_days = 5

[[rule]]
name = "fresh-security-whiteboard"
description = "Bugs whiteboard-tagged security are hidden for their first 5 days"
action = "deny"
[rule.match]
# Case-insensitive substring search in the bug's whiteboard.
whiteboard_contains = ["security"]
younger_than_days = 5

# ---------------------------------------------------------------------------
# Inactive examples: the remaining actions and match criteria.
# Uncomment and adapt as needed. A rule with NO match table at all is a
# catch-all that matches every bug.
# ---------------------------------------------------------------------------

# Redacted summary view plus commenting, nothing else. Note that "read" is NOT
# granted here; granting "read" would implicitly grant "summary" as well
# (read implies summary — the only implication).
#[[rule]]
#name = "security-product-comment-only"
#description = "Summary view plus commenting on the security product"
#action = "restrict"
## Required (non-empty) because action = "restrict"; must be absent for
## allow/deny rules. Full vocabulary, for reference:
##   read summary comments history attachments   (read capabilities)
##   comment status fields assign cc deps        (write capabilities)
##   create attach                               (write: file new bugs, upload attachments)
#capabilities = ["summary", "comment"]
#[rule.match]
#products = ["Security*"]

# Filing new bugs ("create") and uploading attachments ("attach") are
# capabilities like any other. A create request has no bug id yet, so the
# policy judges the bug AS DESCRIBED by the request — a deny rule above
# therefore also refuses filing into anything it hides by name, with no
# extra configuration, for every create request that REACHES it (a grant
# matched earlier, like "reporters", decides first). A request that omits a
# field a rule asks about is refused (unknown, not empty), and the request's
# OWN claim about `groups` is never trusted: Bugzilla unions the product's
# mandatory groups into whatever was claimed, so what groups the created bug
# would end up in cannot be known before it exists. That is why accepting
# new bugs takes a rule scoped with `operations = ["create"]`, placed before
# every group-consulting rule and matching on fields the request does carry
# (products, components, summary, keywords, ...) — see the "reporters" rule
# in section 0 at the top of this file and its comment for the full
# reasoning.
#
# "attach" is judged against the target bug like every other write (the
# bug exists, so its real group list is fetched and rule 1 applies
# normally), and the upload is capped by max_attachment_bytes above.

# Every remaining match criterion, in one rule.
#[[rule]]
#name = "hot-bugs-look-dont-touch"
#description = "Escalated, still-open bugs: readable but frozen"
#action = "restrict"
#capabilities = ["read", "comments", "history", "attachments"]
#[rule.match]
## Matches if ANY of the bug's components matches ANY of these globs.
#components = ["Partner*"]
## Bug status must match one of these globs...
#statuses = ["NEW", "IN_PROGRESS", "CONFIRMED"]
## ...AND severity one of these...
#severities = ["critical", "urgent"]
## ...AND priority one of these.
#priorities = ["P0", "P1"]

# No catch-all rule: bugs that reach the end of the list get default_action
# ("allow" above), minus write capabilities whenever the server runs
# read-only.
