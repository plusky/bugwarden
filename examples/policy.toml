# bugwarden guard policy — worked example
# =======================================
#
# The scenario this file implements:
#
#   * undisclosed (embargoed) security bugs are completely invisible, always;
#   * so is every bug that is not world-readable — see rule 1, which is
#     deliberately broader than "security" and can be narrowed;
#   * bugs labelled "security" are invisible while they are fresher than
#     5 days (the window in which details are typically still unreviewed);
#   * every other bug is shown to the user in full.
#
# The policy is read once at server startup (--policy / BUGWARDEN_POLICY) and
# is never visible to the MCP client. Parsing is strict: unknown keys anywhere
# are a startup error, so typos cannot silently disable a guard.
#
# Rule evaluation order:
#   1. global.min_bug_age_days (a too-young bug is invisible, no rule runs)
#   2. [[rule]] entries top to bottom — FIRST MATCH WINS
#   3. default_action for bugs no rule matched
#
# Unreadable metadata: if a bug object does not carry a field some rule asks
# about — absent, null, wrongly typed, or a list with an unreadable element —
# that rule cannot be decided and the bug is DENIED, whatever the rule's
# action. This holds for every criterion below, so none of them repeats it.
# A field that is present but empty ("" or []) is knowledge, not ignorance,
# and matches normally.
#
# Glob syntax (products/components/groups/keywords/statuses/severities/
# priorities): case-insensitive match of the whole value; '*' matches any
# (possibly empty) substring; everything else is literal.

# What happens to bugs that no rule below matches: everything not caught by a
# rule stays fully visible.
# One of "allow" | "deny" ("restrict" is not permitted here — use a catch-all
# restrict rule as the last [[rule]] instead).
default_action = "allow"

[global]
# Blanket minimum age for EVERY bug, regardless of labels. This example does
# not use it — freshness is only restricted for security bugs, via the rules
# below — but set it to N to make all bugs younger than N days invisible.
min_bug_age_days = 0

# Master switch for private content: comments, attachment metadata, and
# attachment downloads. Even with `true`, each call must additionally pass
# include_private = true. On an attachment download a MISSING privacy flag
# counts as private. Default (and recommended): false.
allow_private_comments = false

# Strip all write capabilities from every grant and remove the write tools
# from the MCP tool listing. The --read-only CLI flag ORs into this — the CLI
# can tighten this policy but never loosen it.
read_only = false

# Tool names to remove from the MCP tool listing entirely (clients never see
# them). Works independently of read_only.
#disabled_tools = ["update_bug_dependencies", "mark_as_duplicate"]

# Largest attachment (decoded bytes) download_attachment may return; the
# content is embedded base64 in the tool result and consumes model context.
# 0 removes the cap. Default: 2 MiB.
#max_attachment_bytes = 2097152

# ---------------------------------------------------------------------------
# 1. Undisclosed security bugs: fully invisible, at any age.
#
# An issue under embargo is one whose public disclosure date has not arrived
# yet, and it is normally recognisable two ways, independently: the bug is
# readable only through a Bugzilla group, and its title carries a marker the
# security team removes when the issue goes public. Either signal alone is
# enough to hide the bug here, which means a bug that loses one of them (a
# permission edited by hand, a marker typo) is still covered by the other.
#
# NOTE: criteria inside one `match` are AND-ed (a bug must satisfy all of
# them), while entries inside one list are ORed. "Restricted OR marked"
# therefore needs two consecutive deny rules, not one.
#
# NOTE: a bug's title is itself sensitive while the issue is undisclosed — it
# names the package and often the flaw. That is why these rules use `deny`
# and not `restrict` with a `summary` capability: a summary view would hand
# the client exactly the line that must not leak.
# ---------------------------------------------------------------------------

[[rule]]
name = "group-restricted"
description = "Bugs that are not world-readable are invisible"
action = "deny"
[rule.match]
# true = the bug is readable only through at least one Bugzilla group. This
# asks the question in an instance-independent way, so it needs no knowledge
# of local group names and cannot be defeated by a group being renamed.
#
# This is deliberately broad: it also hides non-security bugs that happen to
# be group-restricted (partner-confidential reports, internal-only products).
# To hide only the security groups instead, replace this rule with a glob on
# the names your instance actually uses, e.g. groups = ["*security*"].
group_restricted = true

[[rule]]
name = "undisclosed-marker"
description = "Bugs whose title marks them as not yet disclosed are invisible"
action = "deny"
[rule.match]
# Case-insensitive substring search in the bug's one-line summary.
summary_contains = ["embargo"]

[[rule]]
name = "embargo-keyword"
description = "Bugs flagged with an embargo keyword are invisible"
action = "deny"
[rule.match]
# Keyword vocabularies are per-instance; check yours and adjust these globs.
keywords = ["security-embargo", "embargo*"]

# ---------------------------------------------------------------------------
# 2. Fresh security bugs: invisible until they are 5 days old.
#
# Both criteria are AND-ed, so these rules hide a bug only while it is BOTH
# security-labelled AND younger than 5 days. Once a world-readable bug ages
# past the window, no rule matches it any more and default_action ("allow")
# applies — it becomes fully visible without any policy change. (A
# group-restricted bug stays hidden at any age: rule 1 catches it first.)
#
# Two rules because "security" can be expressed two ways here; drop the one
# your instance does not use. A group-based variant would be pointless: any
# bug in a security group is already denied by rule 1.
# ---------------------------------------------------------------------------

[[rule]]
name = "fresh-security-keyword"
description = "Security-keyworded bugs are hidden for their first 5 days"
action = "deny"
[rule.match]
keywords = ["security*"]
younger_than_days = 5

[[rule]]
name = "fresh-security-whiteboard"
description = "Bugs whiteboard-tagged security are hidden for their first 5 days"
action = "deny"
[rule.match]
# Case-insensitive substring search in the bug's whiteboard.
whiteboard_contains = ["security"]
younger_than_days = 5

# ---------------------------------------------------------------------------
# Inactive examples: the remaining actions and match criteria.
# Uncomment and adapt as needed. A rule with NO match table at all is a
# catch-all that matches every bug.
# ---------------------------------------------------------------------------

# Redacted summary view plus commenting, nothing else. Note that "read" is NOT
# granted here; granting "read" would implicitly grant "summary" as well
# (read implies summary — the only implication).
#[[rule]]
#name = "security-product-comment-only"
#description = "Summary view plus commenting on the security product"
#action = "restrict"
## Required (non-empty) because action = "restrict"; must be absent for
## allow/deny rules. Full vocabulary, for reference:
##   read summary comments history attachments   (read capabilities)
##   comment status fields assign cc deps        (write capabilities)
#capabilities = ["summary", "comment"]
#[rule.match]
#products = ["Security*"]

# Every remaining match criterion, in one rule.
#[[rule]]
#name = "hot-bugs-look-dont-touch"
#description = "Escalated, still-open bugs: readable but frozen"
#action = "restrict"
#capabilities = ["read", "comments", "history", "attachments"]
#[rule.match]
## Matches if ANY of the bug's components matches ANY of these globs.
#components = ["Partner*"]
## Bug status must match one of these globs...
#statuses = ["NEW", "IN_PROGRESS", "CONFIRMED"]
## ...AND severity one of these...
#severities = ["critical", "urgent"]
## ...AND priority one of these.
#priorities = ["P0", "P1"]

# No catch-all rule: bugs that reach the end of the list get default_action
# ("allow" above), minus write capabilities whenever the server runs
# read-only.
