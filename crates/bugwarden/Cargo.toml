[package]
name = "bugwarden"
description = "MCP server for Bugzilla with operator-controlled security guards"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["bugzilla", "mcp", "llm", "security", "server"]
categories = ["command-line-utilities", "web-programming::http-server"]

[lints]
workspace = true

[dependencies]
bugwarden-core = { path = "../bugwarden-core", version = "0.1.0" }

rmcp = { version = "2.2", features = [
    "server",
    "macros",
    "transport-io",
    "transport-streamable-http-server",
] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net"] }
tokio-util = "0.7"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", features = ["chrono04"] }
chrono = { version = "0.4", features = ["serde"] }

clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
