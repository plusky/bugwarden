[package]
name = "bugwarden"
description = "MCP server for Bugzilla with operator-controlled security guards"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["bugzilla", "mcp", "llm", "security", "server"]
categories = ["command-line-utilities", "web-programming::http-server"]

# Two bins live here once the gen feature is on; a bare `cargo run -p
# bugwarden` must mean the shipped binary.
default-run = "bugwarden"

[[bin]]
name = "bugwarden"
path = "src/main.rs"

# Dev/packaging asset generator; built only with `--features gen` so the
# shipped `bugwarden` binary never drags in clap_complete/clap_mangen.
[[bin]]
name = "bugwarden-gen"
path = "src/bin/bugwarden-gen.rs"
required-features = ["gen"]

[features]
gen = ["dep:clap_complete", "dep:clap_mangen"]

[lints]
workspace = true

[dependencies]
bugwarden-core = { path = "../bugwarden-core", version = "0.3.0" }

rmcp = { version = "3.1", features = [
    "server",
    "macros",
    "transport-io",
    "transport-streamable-http-server",
] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net"] }
tokio-util = "0.7"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", features = ["chrono04"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.11"
thiserror = "2"
toml = "1.1"

clap = { version = "4", features = ["derive", "env"] }
clap_complete = { version = "4", optional = true }
clap_mangen = { version = "0.3", optional = true }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# The integration tests drive the tools through a real MCP session — over an
# in-memory duplex transport (tools_wiremock) and over real streamable HTTP
# (http_transport_wiremock) — so the client half of rmcp is needed here. The
# rmcp `reqwest` feature selects rustls, matching the rustls-only workspace.
rmcp = { version = "3.1", features = [
    "client",
    "transport-streamable-http-client-reqwest",
    "reqwest",
] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util"] }
wiremock = "0.6"
