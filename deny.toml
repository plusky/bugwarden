# cargo-deny config for the bugwarden Rust workspace (cargo-deny >= 0.18.4).
#
# From the repository root:
#   cargo deny check
#
# CI: EmbarkStudios/cargo-deny-action@v2 discovers this file next to the
# workspace Cargo.toml.

[graph]
all-features = false
no-default-features = false

[advisories]
version = 2
yanked = "deny"
# Fail hard on unmaintained *workspace* crates; transitive noise can wait until
# the graph grows. Override with ignore + issue id if needed.
unmaintained = "workspace"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
# Pre-approve licenses we expect once real deps land (rmcp, tokio, axum,
# reqwest, clap, serde, …). unused-allowed-license=allow so an entry the graph
# does not (yet) use does not WARN-spam CI.
unused-allowed-license = "allow"
allow = [
    # Project license
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    # Common permissive (tokio/axum/reqwest/serde ecosystem)
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "0BSD",
    # webpki-roots (reqwest + rustls certificate store)
    "CDLA-Permissive-2.0",
    # File-level copyleft; fine to link from an Apache-2.0 project
    "MPL-2.0",
    # ring and other rustls-adjacent crypto crates
    "OpenSSL",
    # Copyleft (GPL/LGPL/AGPL) is deliberately absent: bugwarden is a
    # permissive Apache-2.0 project and no dependency needs it.
]
exceptions = []

[bans]
multiple-versions = "warn"
# Path deps must pin the workspace version rather than use a wildcard.
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
