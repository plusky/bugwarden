# cargo-mutants config; the scheduled runner is .github/workflows/mutants.yml.
# Not a cargo config -- cargo reads only config.toml out of a project .cargo/
# and ignores this. Unknown keys are rejected, so a typo fails loud.
#
# Both keys describe this test suite rather than CI, so a hand-run (which is
# how mutation testing mostly happens here) picks them up too. Scope is
# deliberately absent: the workflow passes its own --file.

# MANDATORY, not a tuning knob. The guard lives in bugwarden-core but is
# pinned by the integration suite in the `bugwarden` crate, which
# cargo-mutants' default per-package test scoping never runs. Without this,
# guard.rs reports 19 survivors; 7 are false (killed by the bugwarden crate's
# suite), 12 are real (#244).
test_workspace = true

# A floor, because the auto-derived cap is measured against a different
# command than the one it caps: 25.3.1 does not apply test_workspace to the
# baseline, so it times `cargo test -p bugwarden-core` (~4s) and then caps
# `cargo test --workspace` (~20s unmutated) at max(20s, 5x baseline) = 20s.
# That alone reported a dozen guard.rs mutants as timeouts; most resolve at
# 20-23s. The floor must also clear this suite's failure paths, which hold
# deliberate multi-second barriers (a 30s deadline on every request a test
# awaits from the server, an 8s bounded wait in otel_wiremock, 20s
# child-process budgets in binary_user_agent and http_auth_wiremock) so a
# broken build fails instead of hanging -- an additive cost no multiple of a
# 20s happy path expresses.
#
# The 30s deadline is the largest, and it is paid PER TEST, not once: a
# mutant that leaves requests unanswered costs a binary
# ceil(failing tests / test threads) x 30s, since libtest defaults its
# thread count to the core count. Measured under a hand-applied
# CatchUnwind mutant that answers nothing, on a 32-core box and then at
# --test-threads=4 to stand in for ubuntu-latest's 4-vCPU runner: the
# lib binary's 22 failures take 31s and 158s, audit_wiremock's 36 take
# 60s and 271s, tools_wiremock's 82 take 91s and 632s. Size the floor
# from that 4-thread side of the largest harness: tools_wiremock has
# 85 tests, ceil(85 / 4) x 30s = 660s, call it 720 (#283). A hang
# confined to that harness used to report TIMEOUT with the verdict
# unknown; 720s clears the measured 632s with margin.
#
# The floor is per mutant. Caught mutants still finish in tens of
# seconds, so raising it costs only when a mutant actually hangs. A
# shard of real hangs would still trip mutants.yml's timeout-minutes
# (720s x ~36 is past 240 min) and that is the finding -- the job cap
# is the outer bound, not this floor.
#
# A floor and not --timeout, so the 5x multiplier still scales past it on a
# slow runner or once upstream fixes the baseline.
minimum_test_timeout = 720

# Three serve_failure match arms #261 already called unreachable: rmcp always
# constructs ExpectedInitializeRequest(Some(_)), maps this handler's
# InitializeResult, and ServiceExt::serve never cancels its token. Deleting
# them is a no-op (the wildcard still compiles) so they survive every week
# and the scheduled job emails a false gap. Reachable arms stay in scope
# (Some(frame), ConnectionClosed, InitializeFailed, TransportError). Drop
# these if rmcp starts constructing the variants.
exclude_re = [
    "ExpectedInitializeRequest\\(None\\)",
    "UnexpectedInitializeResponse",
    "Failure::Cancelled",
]
