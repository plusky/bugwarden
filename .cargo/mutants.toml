# cargo-mutants config; the scheduled runner is .github/workflows/mutants.yml.
# Not a cargo config -- cargo reads only config.toml out of a project .cargo/
# and ignores this. Unknown keys are rejected, so a typo fails loud.
#
# Both keys describe this test suite rather than CI, so a hand-run (which is
# how mutation testing mostly happens here) picks them up too. Scope is
# deliberately absent: the workflow passes its own --file.

# MANDATORY, not a tuning knob. The guard lives in bugwarden-core but is
# pinned by the integration suite in the `bugwarden` crate, which
# cargo-mutants' default per-package test scoping never runs. Without this,
# guard.rs reports 19 survivors; 7 are false (killed by the bugwarden crate's
# suite), 12 are real (#244).
test_workspace = true

# A floor, because the auto-derived cap is measured against a different
# command than the one it caps: 25.3.1 does not apply test_workspace to the
# baseline, so it times `cargo test -p bugwarden-core` (~4s) and then caps
# `cargo test --workspace` (~20s unmutated) at max(20s, 5x baseline) = 20s.
# That alone reported a dozen guard.rs mutants as timeouts; most resolve at
# 20-23s. The floor must also clear this suite's failure paths, which hold
# deliberate multi-second barriers (a 30s deadline on every request a test
# awaits from the server, an 8s bounded wait in otel_wiremock, 20s
# child-process budgets in binary_user_agent and http_auth_wiremock) so a
# broken build fails instead of hanging -- an additive cost no multiple of a
# 20s happy path expresses.
#
# The 30s deadline is the largest, and it is paid PER TEST, not once: a
# mutant that leaves requests unanswered costs a binary
# ceil(failing tests / test threads) x 30s, since libtest defaults its
# thread count to the core count. Measured under a hand-applied
# CatchUnwind mutant that answers nothing, on a 32-core box and then at
# --test-threads=4 to stand in for ubuntu-latest's 4-vCPU runner: the
# lib binary's 22 failures take 31s and 158s, audit_wiremock's 36 take
# 60s and 271s, tools_wiremock's 82 take 91s and 632s. Size the floor
# from that 4-thread side of the largest harness: tools_wiremock has
# 85 tests, ceil(85 / 4) x 30s = 660s, call it 720 (#283). A hang
# confined to that harness used to report TIMEOUT with the verdict
# unknown; 720s clears the measured 632s with margin.
#
# The floor is per mutant. Caught mutants still finish in tens of
# seconds, so raising it costs only when a mutant actually hangs. A
# shard of real hangs would still trip mutants.yml's timeout-minutes
# (720s x ~36 is past 240 min) and that is the finding -- the job cap
# is the outer bound, not this floor.
#
# A floor and not --timeout, so the 5x multiplier still scales past it on a
# slow runner or once upstream fixes the baseline.
minimum_test_timeout = 720

# Three serve_failure match arms #261 already called unreachable: rmcp always
# constructs ExpectedInitializeRequest(Some(_)), maps this handler's
# InitializeResult, and ServiceExt::serve never cancels its token. Deleting
# them is a no-op (the wildcard still compiles) so they survive every week
# and the scheduled job emails a false gap. Reachable arms stay in scope
# (Some(frame), ConnectionClosed, InitializeFailed, TransportError). Drop
# these if rmcp starts constructing the variants.
#
# Proven-equivalent mutants, 2026-10-11 campaign: each entry below was found
# by a scheduled run, hand-proved behaviorally identical, and pinned by an
# anchor test (or documented where no test can reach it). They are excluded
# so the Saturday summary stays a list of real gaps, not a standing roster.
# Unlike the unreachable arms above, these are LIVE code: re-examine an
# entry when touching its function. Entries are LINE-ANCHORED on purpose:
# a bare function+operator pattern also hides mutants the suite DOES kill
# (verified: it swept 2268:34, 2302:55, 2120:14/18, 2168/2179/2182/2183,
# 1662:17 along with the intended ones). Line drift fails safe — the
# mutant reappears and gets re-triaged — while a broad pattern would fail
# silent. The two exceptions are single-instance function shapes with no
# killed POL siblings (elapsed_ms, flush razor).
exclude_re = [
    "ExpectedInitializeRequest\\(None\\)",
    "UnexpectedInitializeResponse",
    "Failure::Cancelled",
    # Keyword-skip conjunctions in qs_refuse_operand/token: first-byte
    # disjointness plus the bare-word fallthrough make each one
    # unreachable-in-effect; the redundancy doc-anchor passes on both by
    # construction. One entry per proven site.
    "server\\.rs:2241:22:.*\\|\\| with &&",
    "server\\.rs:2241:38:.*\\|\\| with &&",
    "server\\.rs:2291:37:.*\\|\\| with &&",
    "server\\.rs:2323:27:.*\\|\\| with &&",
    "server\\.rs:2323:44:.*\\|\\| with &&",
    "server\\.rs:2340:30:.*\\|\\| with &&",
    "server\\.rs:2340:46:.*\\|\\| with &&",
    "server\\.rs:2362:23:.*\\|\\| with &&",
    "server\\.rs:2362:40:.*\\|\\| with &&",
    "server\\.rs:2326:32:.*\\|\\| with &&",
    "server\\.rs:2343:35:.*\\|\\| with &&",
    # Loop-bound <= pairs with no observable difference: the extra
    # iteration short-circuits on None.
    "server\\.rs:2094:13:.*< with <=",
    "server\\.rs:2114:13:.*< with <=",
    "server\\.rs:2140:13:.*< with <=",
    # mask.get(i+1) reads mask[i]: the loop-top guard already proved it,
    # so the pair can only differ where it cannot happen.
    "server\\.rs:2125:27:.*\\+ with \\*",
    # The shorthand digit counter feeds only an ==0 check, so a stuck
    # counter is indistinguishable.
    "server\\.rs:2167:16:.*\\+= with -=",
    # Wall-clock durations no deterministic assertion can pin.
    "server\\.rs:1121:5:.*elapsed_ms",
    # The flush deadline razor: the only divergence is a measure-zero
    # timing window.
    "server\\.rs:1420:35:.*< with <=",
    # Line-anchored: the reverse-order shifting construction makes static
    # traps impossible here, and permission failures converge downstream,
    # so forcing these two guards true changes no observable outcome.
    "audit\\.rs:1565:.*match guard.*with true",
    "audit\\.rs:1573:.*match guard.*with true",
    # The export-loss mirror is redundant single-threaded: peek>0 implies
    # the take below returns the same count and stores the same flag, so
    # the peek branch cannot diverge (absorb_export_losses). Kept for the
    # nanosecond race it narrows; untestable by design.
    "audit\\.rs:1657:.*> with <",
    # Shutdown-tail inner tiers: the remainder is always length 1
    # post-flush, so immediate-vs-final flushing ends with identical
    # record sets and posts — timing only (1241/1264 audit/diag tiers).
    "otel\\.rs:1241:33:.*> with (==|>=)",
    "otel\\.rs:1264:33:.*> with (==|>=)",
    # Bit-idiom pairs provable over their domains: bit 7 is always clear
    # across the 128 varint inputs (`|` canonical), and tag shifts carry
    # wire types 0-2 with zero low bits, so OR≡XOR in both.
    "otel\\.rs:638:27:.*\\| with \\^",
    "otel\\.rs:643:46:.*\\| with \\^",
    # Hang mutants, hand-reproduced and documented (never tests — a hang
    # test would park the suite): the probe counter frozen at 1 never
    # reaches its bound (931), and the varint zero case loops pushing
    # continuation bits forever (634). Excluded so the Saturday run does
    # not pay the timeout floor weekly for a verdict already in hand.
    "otel\\.rs:931:21:.*\\+= with \\*=",
    "otel\\.rs:634:22:.*== with !=",
    # The glob backtrack advance is unobservable: `p = star_pos` re-enters
    # the `'*'` arm and lands on the identical (p, resume, s) state one
    # iteration later (or skips the same `'*'` in the trailing-star loop),
    # proven by 265k exhaustive + 200k random differential cases with zero
    # divergences.
    "policy\\.rs:171:26:.*\\+ with \\*",
]
